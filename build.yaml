# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41  nice_view_adapter nice_view
#snippet: studio-rpc-usb-uart 
---
include:
  # Dongle = central. Holds the keymap + ZMK Studio (USB). No keys, no display.
  - board: nice_nano_v2
    shield: keyball44_dongle
    snippet: studio-rpc-usb-uart
  # Both halves are now peripherals. The right half hosts the trackball and
  # forwards it to the dongle over BLE.
  - board: nice_nano_v2
    shield: keyball44_left nice_view_adapter nice_view
  - board: nice_nano_v2
    shield: keyball44_right nice_view_adapter nice_view
  # Flash this to any board to wipe BLE bonds (needed when re-pairing the 3 pieces).
  - board: nice_nano_v2
    shield: settings_reset
