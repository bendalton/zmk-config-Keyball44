# macOS BLE reliability: raise the connection-interval floor.
# A too-low MIN_INT makes macOS mis-negotiate latency and drop the HID link
# while USB/split stay fine (zmkfirmware/zmk#2661). Old values (MAX_INT=9,
# no MIN_INT -> default 6) were the exact anti-pattern.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# enable auto-sleeping after being idle for 15 mins (unit: ms)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Pointing subsystem. Needed on ALL THREE builds (halves + dongle): the right
# half compiles the input-split forwarder under `if ZMK_POINTING`, and the
# dongle needs it for the input-listener that turns forwarded motion into HID.
# (Central battery fetching/proxy moved to the dongle conf -- central-only.)
CONFIG_ZMK_POINTING=y

# Display config below is used by the two keyboard HALVES (each has a nice!view).
# The dongle has no display and overrides CONFIG_ZMK_DISPLAY=n in keyball44_dongle.conf.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Disable idle blanking (no redraw churn; important for the static central screen)
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Custom status screen (our module provides zmk_display_status_screen()):
# left/peripheral = portrait dashboard, right/central = solid black.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Disable the stock nice_view widget so it doesn't also define the screen.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Fonts for the dashboard
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y