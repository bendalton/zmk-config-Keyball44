# Keyball44 DONGLE (central) — loaded after the shared config/keyball44.conf,
# so settings here override the shared ones for the dongle build only.

# No display hardware on the dongle: override the shared display enable. This
# also forces CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM off (it depends on
# ZMK_DISPLAY), so the custom nice!view dashboard module isn't compiled here.
CONFIG_ZMK_DISPLAY=n

# ZMK Studio lives on the central (USB host side). Moved here from the right
# half, which is now a peripheral. Paired with the studio-rpc-usb-uart snippet
# in build.yaml.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Room for 2 peripherals + several host BLE profiles (peripherals + profiles).
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6

# Central battery fetching/proxy is intentionally OFF for the first dongle build:
# with 2 peripherals it interacts with known ZMK dongle GATT-discovery issues
# (zmkfirmware/zmk#3156). The nice!views on the halves show each half's own
# battery locally, so the dongle doesn't need to fetch them. Re-enable later once
# the basic 3-piece link is proven stable.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
