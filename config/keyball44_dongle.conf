# Keyball44 DONGLE (central) — loaded after the shared config/keyball44.conf,
# so settings here override the shared ones for the dongle build only.

# No display hardware on the dongle. The display/LVGL block now lives in the
# two half shields' confs rather than the shared one, so nothing turns this on
# for the dongle -- this line is belt-and-braces, and it keeps
# CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM off (it depends on ZMK_DISPLAY), so
# the custom nice!view dashboard module isn't compiled here.
CONFIG_ZMK_DISPLAY=n

# ZMK Studio lives on the central (USB host side). Moved here from the right
# half, which is now a peripheral. Paired with the studio-rpc-usb-uart snippet
# in build.yaml.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# BLE bond budget. ZMK derives the number of host profiles from these:
#   ZMK_BLE_PROFILE_COUNT = BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS
# (app/include/zmk/ble.h). ZMK's own central default is 6, but that is sized for
# ONE peripheral; with two halves it would leave only 4 host profiles, one fewer
# than the pre-dongle setup had. 7 - 2 = 5 host profiles, matching the old
# right-as-central behaviour.
CONFIG_BT_MAX_PAIRED=7
# Simultaneous connections: 2 peripherals + 1 host = 3. 6 is ample headroom.
CONFIG_BT_MAX_CONN=6

# Central battery fetching/proxy is intentionally OFF for the first dongle build:
# with 2 peripherals it interacts with known ZMK dongle GATT-discovery issues
# (zmkfirmware/zmk#3156). The nice!views on the halves show each half's own
# battery locally, so the dongle doesn't need to fetch them. Re-enable later once
# the basic 3-piece link is proven stable.
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
