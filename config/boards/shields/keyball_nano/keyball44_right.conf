CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_PMW3610=y
CONFIG_PMW3610_CPI=1872
CONFIG_PMW3610_CPI_DIVIDOR=4
CONFIG_PMW3610_ORIENTATION_180=y
CONFIG_PMW3610_SNIPE_CPI=480
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=4
CONFIG_PMW3610_SCROLL_TICK=32
CONFIG_PMW3610_INVERT_SCROLL_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
# 10ms (100Hz) rest sampling so the first nudge after idle doesn't feel dead,
# without the battery cost of FORCE_AWAKE (tested 2026-07: felt the same).
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=10
#CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
#CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=
#CONFIG_PMW3610_REST3_DOWNSHIFT_TIME_MS=
#CONFIG_PMW3610_FORCE_AWAKE=n
# Motion-IRQ driven (not the continuous software poll). The _SW mode floods
# the SPI bus nonstop; non-SW reads only when the ball moves (via irq P1.11).
# 125Hz, not the 250 default: the 250Hz feel test (2026-07) ran over USB, but
# over BLE the connection interval caps HID drain at ~65-130 reports/s, so
# 250 events/s outpaces the link during sustained movement -- the queue backs
# up and the cursor keeps moving 200-300ms after the ball stops. 125Hz stays
# under the BLE budget; the felt latency difference was nil in the feel test.
CONFIG_PMW3610_POLLING_RATE_125=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=700

# Threshold 4 was added to protect the display from event spam, but the old
# right-display glitch was ultimately a loose solder joint on the display
# socket (hardware), so the sensor config never needed to compensate. A
# threshold acts as a deadzone that stair-steps slow precise movement; 0 =
# full fidelity (tested 2026-07, no downsides). If the cursor ever swims at
# rest, step up to 1-2. Also the next lever if BLE backlog lag persists at
# 125Hz: a small threshold trims the event stream during slow movement.
CONFIG_PMW3610_MOVEMENT_THRESHOLD=0

# Fix the nice!view freeze-then-speckle on this (central) half: the ZMK
# dedicated display thread overflows its default 2048B stack -- heavy
# Montserrat-26 font + the fuller central widget set + trackball load -- then
# silently hangs, and the Sharp LCD decays (nice!view has no VCOM upkeep on
# Zephyr 3.5). Give the thread plenty of headroom.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
