# Left half = peripheral (unchanged role). In the dongle setup BOTH halves are
# peripherals and render the same companion nice!view dashboard (battery +
# split-link + Orbit), so give the display thread the same stack headroom the
# right half uses, to avoid the overflow-then-speckle failure on the Orbit canvas.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192

# ---- Display (nice!view). Kept per-half rather than in the shared
# config/keyball44.conf, which also applies to the display-less dongle. ----
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y

# Disable idle blanking (no redraw churn).
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Custom status screen: our module provides zmk_display_status_screen().
# Content is chosen by split role, geometry by side (see src/kb_display.c).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# Disable the stock nice_view widget so it doesn't also define the screen.
CONFIG_NICE_VIEW_WIDGET_STATUS=n

# Fonts for the dashboard
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_USE_IMG=y
CONFIG_LV_USE_CANVAS=y
