# Left half = peripheral (unchanged role). In the dongle setup BOTH halves are
# peripherals and render the same companion nice!view dashboard (battery +
# split-link + Orbit), so give the display thread the same stack headroom the
# right half uses, to avoid the overflow-then-speckle failure on the Orbit canvas.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192
